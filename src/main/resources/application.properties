spring.application.name=kbeauty-ai-erp
spring.datasource.url=jdbc:postgresql://localhost:5433/kbeauty_erp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Enable chat with the ai profile. The ERP can run without Ollama.
spring.ai.model.chat=none
spring.ai.chat.client.enabled=false
spring.ai.model.embedding=none

# Keep the current view in a cookie-based session, without session IDs in URLs.
server.servlet.session.tracking-modes=cookie
